name: Build & test

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "**/*.md"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.24.5"
  JAVA_VERSION: "17"
  ANDROID_PLATFORM: "android-36"
  ANDROID_BUILD_TOOLS: "36.0.0"

jobs:
  test:
    name: Analyze & test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test --reporter expanded

  build-apk:
    name: Build release APK
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # The runner image ships an Android SDK, but not necessarily the
      # platform/build-tools versions this project compiles against.
      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;${ANDROID_PLATFORM}" "build-tools;${ANDROID_BUILD_TOOLS}" "platform-tools" "ndk;27.0.12077973"

      - name: Install dependencies
        run: flutter pub get

      - name: Prepare release signing
        env:
          EVENT_NAME: ${{ github.event_name }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            if [ "$EVENT_NAME" != "pull_request" ]; then
              echo "::error::KEYSTORE_BASE64 is not configured in repository secrets."
              exit 1
            fi
            echo "::warning::Release signing secrets are not available to this pull request; using the debug key."
            echo "APK_SIGNING=debug fallback" >> "$GITHUB_ENV"
            exit 0
          fi
          for name in KEYSTORE_PASSWORD KEY_ALIAS; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is required when KEYSTORE_BASE64 is configured."
              exit 1
            fi
          done
          KEYSTORE_PATH="$RUNNER_TEMP/praxis-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 0600 "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "APK_SIGNING=release keystore" >> "$GITHUB_ENV"

      - name: Read version
        id: version
        run: |
          set -euo pipefail
          RAW="$(awk '/^version:/{print $2}' pubspec.yaml)"
          VERSION="${RAW%%+*}"
          BASE_CODE=0
          if [[ "$RAW" == *"+"* ]]; then BASE_CODE="${RAW##*+}"; fi
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$((BASE_CODE + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          flutter build apk --release \
            --build-name "${{ steps.version.outputs.name }}" \
            --build-number "${{ steps.version.outputs.code }}" \
            --dart-define=APP_VERSION="${{ steps.version.outputs.name }}" \
            --dart-define=APP_BUILD="${{ steps.version.outputs.code }}"

      - name: Report APK
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          ls -lh "$APK"
          for lib in libproot.so libproot-loader.so; do
            if ! unzip -l "$APK" | grep -qF "lib/arm64-v8a/$lib"; then
              echo "::error::$lib is missing from the APK."
              exit 1
            fi
          done
          APKSIGNER="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$APKSIGNER" verify --print-certs "$APK" | tee "$RUNNER_TEMP/apk-certs.txt"
          CERT_SHA="$(grep -m1 'SHA-256 digest' "$RUNNER_TEMP/apk-certs.txt" | sed 's/.*: //' || true)"
          {
            echo "### Praxis release APK"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Size | $(du -h "$APK" | cut -f1) |"
            echo "| SHA-256 | \`$(sha256sum "$APK" | cut -d' ' -f1)\` |"
            echo "| Signing | ${APK_SIGNING:-unknown} |"
            echo "| Certificate SHA-256 | \`$CERT_SHA\` |"
            echo "| Flutter | ${FLUTTER_VERSION} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: praxis-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
