name: Release APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (for example v2.2.0)"
        required: false
        default: "v2.2.0"
      prerelease:
        description: "Mark this release as a pre-release"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.24.5"
  JAVA_VERSION: "17"
  ANDROID_PLATFORM: "android-36"
  ANDROID_BUILD_TOOLS: "36.0.0"

jobs:
  release:
    name: Build, sign and publish
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Verify signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          missing=0
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is not configured in repository secrets."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "Signing secrets are present."

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/praxis-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 0600 "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;${ANDROID_PLATFORM}" "build-tools;${ANDROID_BUILD_TOOLS}" "platform-tools" "ndk;27.0.12077973"

      - name: Install dependencies
        run: flutter pub get

      - name: Read version
        id: version
        run: |
          set -euo pipefail
          VERSION="$(awk '/^version:/{print $2}' pubspec.yaml | cut -d+ -f1)"
          if [ -z "$VERSION" ]; then
            echo "::error::Could not read version from pubspec.yaml"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building Praxis $VERSION"

      - name: Build signed release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/praxis-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build apk --release

      - name: Verify signature and package APK
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -f "$APK"
          APKSIGNER="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$APKSIGNER" verify --print-certs "$APK"
          cp "$APK" "praxis-${VERSION}.apk"
          ls -lh "praxis-${VERSION}.apk"
          sha256sum "praxis-${VERSION}.apk"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: praxis-${{ steps.version.outputs.version }}-apk
          path: praxis-${{ steps.version.outputs.version }}.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          if [ -z "$TAG" ]; then
            TAG="v$VERSION"
          fi
          ASSET="praxis-${VERSION}.apk"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber
          else
            ARGS=(--title "Praxis $VERSION" --notes "Signed release APK for Praxis $VERSION. Built from the release workflow on the dispatched commit.")
            if [ "$PRERELEASE" = "true" ]; then
              ARGS+=(--prerelease)
            fi
            gh release create "$TAG" "$ASSET" "${ARGS[@]}"
          fi
