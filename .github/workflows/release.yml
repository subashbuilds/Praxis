name: Release APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag — leave empty to use v(version)"
        required: false
        default: ""
      prerelease:
        description: "Mark this release as a pre-release"
        required: false
        type: boolean
        default: false
      changelog:
        description: "Release notes in Markdown — leave empty for the default release note"
        required: false
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.24.5"
  JAVA_VERSION: "17"
  ANDROID_PLATFORM: "android-36"
  ANDROID_BUILD_TOOLS: "36.0.0"

jobs:
  release:
    name: Build, sign and publish
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Verify signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          missing=0
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is not configured in repository secrets."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/praxis-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 0600 "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;${ANDROID_PLATFORM}" "build-tools;${ANDROID_BUILD_TOOLS}" "platform-tools" "ndk;27.0.12077973"

      - name: Install dependencies
        run: flutter pub get

      - name: Read version and compute versionCode
        id: version
        run: |
          set -euo pipefail
          RAW="$(awk '/^version:/{print $2}' pubspec.yaml)"
          VERSION="${RAW%%+*}"
          BASE_CODE=0
          if [[ "$RAW" == *"+"* ]]; then
            BASE_CODE="${RAW##*+}"
          fi
          if [ -z "$VERSION" ]; then
            echo "::error::Could not read version from pubspec.yaml"
            exit 1
          fi
          if ! [[ "$BASE_CODE" =~ ^[0-9]+$ ]]; then
            echo "::error::The build number in pubspec.yaml must be an integer."
            exit 1
          fi
          # Every release run gets a higher versionCode than the pubspec base,
          # so Android can update an installed Praxis build in place.
          VERSION_CODE=$((BASE_CODE + GITHUB_RUN_NUMBER))
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="v$VERSION"
          elif [[ "$TAG" != v* ]]; then
            TAG="v$TAG"
          fi
          {
            echo "version=$VERSION"
            echo "version_code=$VERSION_CODE"
            echo "tag=$TAG"
          } >> "$GITHUB_OUTPUT"
          echo "Praxis $VERSION · versionCode $VERSION_CODE · tag $TAG" >> "$GITHUB_STEP_SUMMARY"

      - name: Build split APKs
        env:
          VERSION: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          KEYSTORE_PATH: ${{ runner.temp }}/praxis-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          flutter build apk --release --split-per-abi \
            --build-name "$VERSION" --build-number "$VERSION_CODE" \
            --dart-define=APP_VERSION="$VERSION" \
            --dart-define=APP_BUILD="$VERSION_CODE"

      - name: Build universal APK
        env:
          VERSION: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          KEYSTORE_PATH: ${{ runner.temp }}/praxis-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          flutter build apk --release \
            --build-name "$VERSION" --build-number "$VERSION_CODE" \
            --dart-define=APP_VERSION="$VERSION" \
            --dart-define=APP_BUILD="$VERSION_CODE"

      - name: Verify and package APKs
        id: package
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          OUT=build/app/outputs/flutter-apk
          APKSIGNER="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -name apksigner -type f | sort -V | tail -1)"
          declare -A SOURCES=(
            ["arm64-v8a"]="$OUT/app-arm64-v8a-release.apk"
            ["armeabi-v7a"]="$OUT/app-armeabi-v7a-release.apk"
            ["universal"]="$OUT/app-release.apk"
          )
          {
            echo "### Praxis $VERSION"
            echo ""
            echo "| APK | Size | SHA-256 |"
            echo "|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          for arch in arm64-v8a armeabi-v7a universal; do
            SRC="${SOURCES[$arch]}"
            NAME="Praxis-${VERSION}-${arch}.apk"
            test -f "$SRC"
            cp "$SRC" "$NAME"
            "$APKSIGNER" verify --print-certs "$NAME" > /dev/null
            SHA="$(sha256sum "$NAME" | cut -d' ' -f1)"
            echo "| $NAME | $(du -h "$NAME" | cut -f1) | \`$SHA\` |" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload signed APKs
        uses: actions/upload-artifact@v4
        with:
          name: Praxis-${{ steps.version.outputs.version }}-apks
          path: |
            Praxis-${{ steps.version.outputs.version }}-arm64-v8a.apk
            Praxis-${{ steps.version.outputs.version }}-armeabi-v7a.apk
            Praxis-${{ steps.version.outputs.version }}-universal.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
          CHANGELOG: ${{ inputs.changelog }}
        run: |
          set -euo pipefail
          NAME="Praxis $VERSION"
          ASSETS=(
            "Praxis-${VERSION}-arm64-v8a.apk"
            "Praxis-${VERSION}-armeabi-v7a.apk"
            "Praxis-${VERSION}-universal.apk"
          )
          if [ -n "$CHANGELOG" ]; then
            printf '%s\n' "$CHANGELOG" > "$RUNNER_TEMP/release-notes.md"
          else
            printf '%s\n' "Signed release builds for Praxis $VERSION. Includes arm64-v8a, armeabi-v7a and a universal APK." > "$RUNNER_TEMP/release-notes.md"
          fi
          ARGS=(--title "$NAME" --notes-file "$RUNNER_TEMP/release-notes.md")
          if [ "$PRERELEASE" = "true" ]; then
            ARGS+=(--prerelease)
          fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" "${ARGS[@]}"
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG" "${ASSETS[@]}" "${ARGS[@]}"
          fi
